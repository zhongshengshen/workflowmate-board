<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="refresh" content="45">
<title>📋 WorkflowMate 任务看板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;min-height:100vh}
.board{max-width:900px;margin:0 auto;padding:12px 16px}
h1{font-size:17px;font-weight:600;margin-bottom:12px;color:#111}
.cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.col-title{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:12px;font-weight:600}
.col-count{font-size:12px;color:#999}
.card{padding:10px;margin-bottom:8px;border-radius:8px;border:1px solid;font-size:13px}
.card-type{font-size:10px;padding:1px 6px;border-radius:3px;margin-right:4px}
.type-commitment{background:#FFF3E0;color:#E65100}
.type-decision{background:#E8EAF6;color:#283593}
.type-extracted{background:#F3E5F5;color:#6A1B9A}
.card-title{color:#333;margin-bottom:4px;line-height:1.4}
.card-note{font-size:11px;color:#888;margin-top:3px;line-height:1.3}
.card-time{font-size:10px;color:#bbb;margin-top:4px}
.empty{padding:20px 0;text-align:center;color:#ccc;font-size:13px;border:1px dashed #ddd;border-radius:8px}
.footer{text-align:center;margin-top:20px;font-size:11px;color:#bbb}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.refresh-btn{border:1px solid #ddd;border-radius:6px;padding:3px 10px;background:#fff;cursor:pointer;font-size:12px;color:#666}
.lock-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f5f5f5}
.lock-box{text-align:center;padding:40px;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.lock-box h2{margin-bottom:16px;color:#333}
.lock-box input{padding:8px 16px;border:1px solid #ddd;border-radius:6px;font-size:14px;width:200px;text-align:center}
.lock-box button{margin-top:12px;padding:8px 24px;background:#1a73e8;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px}
.lock-box .err{color:#e53935;margin-top:8px;font-size:13px;display:none}
</style>
</head>
<body>

<!-- 密码保护层 -->
<div class="lock-screen" id="lockScreen">
  <div class="lock-box">
    <h2>🔒 WorkflowMate 任务看板</h2>
    <input type="password" id="pwInput" placeholder="输入访问密码" onkeydown="if(event.key==='Enter')unlock()">
    <br>
    <button onclick="unlock()">进入</button>
    <div class="err" id="errMsg">密码错误</div>
  </div>
</div>

<!-- 看板内容（默认隐藏） -->
<div class="board" id="boardContent" style="display:none">
  <div class="bar">
    <h1>📋 任务看板</h1>
    <button class="refresh-btn" onclick="location.reload()">🔄 刷新</button>
  </div>
  <div class="cols" id="content"></div>
  <div class="footer" id="footer"></div>
</div>

<script>
// 访问密码（SHA-256 hash）
var PASS_HASH='6bee0697eab3552f6c2f1807c953c9e7cdc256233f2c67590e3ab5d988fc9469';

=j(u,r,s,t,o[q+7],10,f);t=j(t,u,r,s,o[q+14],15,f);s=j(s,t,u,r,o[q+5],21,f);r=j(r,s,t,u,o[q+12],6,f);u=j(u,r,s,t,o[q+3],10,f);t=j(t,u,r,s,o[q+10],15,f);s=j(s,t,u,r,o[q+1],21,f);r=j(r,s,t,u,o[q+8],6,f);u=j(u,r,s,t,o[q+15],10,f);t=j(t,u,r,s,o[q+6],15,f);s=j(s,t,u,r,o[q+13],21,f);r=j(r,s,t,u,o[q+4],6,f);u=j(u,r,s,t,o[q+11],10,f);t=j(t,u,r,s,o[q+2],15,f);s=j(s,t,u,r,o[q+9],21,f);r=a(r,w);s=a(s,x);t=a(t,y);u=a(u,z);v=a(v,A)}return(r>>>0).toString(16).padStart(8,'0')+(s>>>0).toString(16).padStart(8,'0')+(t>>>0).toString(16).padStart(8,'0')+(u>>>0).toString(16).padStart(8,'0')}

function unlock(){
  var pw=document.getElementById('pwInput').value;
  if(sha256(pw)===PASS_HASH){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('boardContent').style.display='block';
    sessionStorage.setItem('wfm_auth','1');
  }else{
    document.getElementById('errMsg').style.display='block';
  }
}
if(sessionStorage.getItem('wfm_auth')==='1'){
  document.getElementById('lockScreen').style.display='none';
  document.getElementById('boardContent').style.display='block';
}

var DATA = [{"id": "1778908739017", "type": "commitment", "content": "跟完 7412 供应商报价交期确认（FCA上海 4周）", "status": "in_progress", "createdAt": "2026-05-16T05:18:59.017Z", "statusHistory": [{"status": "pending", "timestamp": "2026-05-16T05:18:59.036Z"}, {"status": "in_progress", "timestamp": "2026-05-16T05:19:19.290Z", "note": "已联系FCA确认交期"}]}, {"id": "1778908753337", "type": "commitment", "content": "跟完 7414 供应商报价（DAP莫斯科 180天）", "status": "pending", "createdAt": "2026-05-16T05:19:13.337Z", "statusHistory": [{"status": "pending", "timestamp": "2026-05-16T05:19:13.337Z"}]}, {"id": "1778908753349", "type": "commitment", "content": "上海乾亦服务费报价成单转化追踪", "status": "pending", "createdAt": "2026-05-16T05:19:13.349Z", "statusHistory": [{"status": "pending", "timestamp": "2026-05-16T05:19:13.349Z"}]}, {"id": "1778908753341", "type": "commitment", "content": "建立 RTX PRO 5000 GPU 测试体系", "status": "pending", "createdAt": "2026-05-16T05:19:13.341Z", "statusHistory": [{"status": "pending", "timestamp": "2026-05-16T05:19:13.341Z"}]}, {"id": "1778908753347", "type": "commitment", "content": "整理周会材料（服务器+AI小组）", "status": "pending", "createdAt": "2026-05-16T05:19:13.347Z", "statusHistory": [{"status": "pending", "timestamp": "2026-05-16T05:19:13.347Z"}]}, {"id": "1778903979342", "type": "commitment", "content": "完成 MCP 端到端验证测试", "status": "completed", "createdAt": "2026-05-16T03:59:39.342Z", "statusHistory": [{"status": "pending", "timestamp": "2026-05-16T03:59:39.360Z"}, {"status": "in_progress", "timestamp": "2026-05-16T03:59:54.664Z", "note": "正在验证 MCP 工具链"}, {"status": "completed", "timestamp": "2026-05-16T04:00:00.705Z", "note": "全链路验证通过"}], "completionNote": "全链路验证通过"}, {"id": "1778916972886", "type": "commitment", "content": "重启后持久化验证", "status": "pending", "createdAt": "2026-05-16T07:36:12.886Z", "statusHistory": [{"status": "pending", "timestamp": "2026-05-16T07:36:12.887Z"}]}, {"id": "1778917094554", "type": "commitment", "content": "自动通知测试", "status": "completed", "createdAt": "202 var COLS = [
  {key:'pending',label:'待办',bg:'#FFF8E1',bc:'#FFE082',badge:'#E65100'},
  {key:'in_progress',label:'进行中',bg:'#E3F2FD',bc:'#90CAF9',badge:'#1565C0'},
  {key:'completed',label:'已完成',bg:'#E8F5E9',bc:'#A5D6A7',badge:'#2E7D32'}
];

function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function ago(d){var m=Math.floor((Date.now()-Date.parse(d))/60000);if(m<1)return'刚刚';if(m<60)return m+'分';var h=Math.floor(m/60);if(h<24)return h+'时';return Math.floor(h/24)+'天'}

COLS.forEach(function(c){
  var items=DATA.filter(function(t){return t.status===c.key});
  var html='<div><div class="col-title"><span style="font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px;background:'+c.bg+';color:'+c.badge+'">'+c.label+'</span><span class="col-count">'+items.length+'</span></div>';
  if(items.length===0)html+='<div class="empty">空</div>';
  else items.forEach(function(t){
    var typeLabel={commitment:'承诺',decision:'决策',extracted:'提取'};
    var typeClass={commitment:'type-commitment',decision:'type-decision',extracted:'type-extracted'};
    var note=[].concat(t.statusHistory||[]).reverse().find(function(h){return h.note});
    html+='<div class="card" style="background:'+c.bg+';border-color:'+c.bc+'"><span class="card-type '+typeClass[t.type||'extracted']+'">'+(typeLabel[t.type||'extracted']||'任务')+'</span><div class="card-title">'+esc(t.content)+'</div>'+(note?'<div class="card-note">📝 '+esc(note.note||'')+'</div>':'')+(t.completionNote?'<div class="card-note" style="color:#2E7D32">✅ '+esc(t.completionNote)+'</div>':'')+'<div class="card-time">'+ago(t.createdAt)+'</div></div>'
  });
  html+='</div>';
  document.getElementById('content').innerHTML+=html
});
document.getElementById('footer').textContent='WorkflowMate · 45秒自动刷新 · 共 '+DATA.length+' 个任务'
</script>
</body>
</html>
