<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="refresh" content="45">
<title>📋 WorkflowMate 任务看板</title>
<style>
:root{--bg:#f5f5f5;--card-bg:#fff;--text:#111;--text2:#555;--text3:#999;--border:#e0e0e0;--shadow:0 1px 4px rgba(0,0,0,.06);--pending-bg:#FFF8E1;--pending-bc:#FFE082;--pending-badge:#E65100;--progress-bg:#E3F2FD;--progress-bc:#90CAF9;--progress-badge:#1565C0;--done-bg:#E8F5E9;--done-bc:#A5D6A7;--done-badge:#2E7D32;--lock-bg:#f5f5f5;--lock-card:#fff}
[data-theme="dark"]{--bg:#121212;--card-bg:#1e1e1e;--text:#e0e0e0;--text2:#aaa;--text3:#777;--border:#333;--shadow:0 1px 4px rgba(0,0,0,.3);--pending-bg:#2a2200;--pending-bc:#5d4600;--pending-badge:#ffb74d;--progress-bg:#0d1b2a;--progress-bc:#1a3a5c;--progress-badge:#64b5f6;--done-bg:#0a1f0a;--done-bc:#1b4a1b;--done-badge:#81c784;--lock-bg:#121212;--lock-card:#1e1e1e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);min-height:100vh;color:var(--text);transition:background .3s,color .3s}
.board{max-width:960px;margin:0 auto;padding:12px 16px}
h1{font-size:17px;font-weight:600;margin-bottom:12px;color:var(--text)}
.cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.col-title{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:12px;font-weight:600}
.col-count{font-size:12px;color:var(--text3)}
.card{padding:10px 12px;margin-bottom:8px;border-radius:10px;border:1px solid;background:var(--card-bg);box-shadow:var(--shadow);font-size:13px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-1px);box-shadow:0 3px 12px rgba(0,0,0,.1)}
.card-type{font-size:10px;padding:1px 6px;border-radius:3px;margin-right:4px}
.type-commitment{background:#FFF3E0;color:#E65100}
.type-decision{background:#E8EAF6;color:#283593}
.type-extracted{background:#F3E5F5;color:#6A1B9A}
[data-theme="dark"] .type-commitment{background:#3e2200;color:#ffb74d}
[data-theme="dark"] .type-decision{background:#1a1a3e;color:#9fa8da}
[data-theme="dark"] .type-extracted{background:#2a0a3e;color:#ce93d8}
.card-title{color:var(--text);margin-bottom:4px;line-height:1.4;font-weight:500}
.card-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.meta-tag{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--bg);color:var(--text2)}
.meta-tag.assignee{background:#E8EAF6;color:#283593}
.meta-tag.due{background:#FFF3E0;color:#E65100}
.meta-tag.overdue{background:#FFEBEE;color:#C62828}
[data-theme="dark"] .meta-tag.assignee{background:#1a1a3e;color:#9fa8da}
[data-theme="dark"] .meta-tag.due{background:#3e2200;color:#ffb74d}
[data-theme="dark"] .meta-tag.overdue{background:#3e0a0a;color:#ef9a9a}
.card-note{font-size:11px;color:var(--text3);margin-top:4px;line-height:1.3}
.card-time{font-size:10px;color:var(--text3);margin-top:4px}
.empty{padding:20px 0;text-align:center;color:var(--text3);font-size:13px;border:1px dashed var(--border);border-radius:8px}
.footer{text-align:center;margin-top:20px;font-size:11px;color:var(--text3)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.bar-left{display:flex;align-items:center;gap:10px}
.refresh-btn{border:1px solid var(--border);border-radius:6px;padding:3px 10px;background:var(--card-bg);cursor:pointer;font-size:12px;color:var(--text2)}
.theme-btn{border:1px solid var(--border);border-radius:6px;padding:3px 8px;background:var(--card-bg);cursor:pointer;font-size:14px;line-height:1}
.lock-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--lock-bg)}
.lock-box{text-align:center;padding:40px;background:var(--lock-card);border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.lock-box h2{margin-bottom:16px;color:var(--text)}
.lock-box input{padding:8px 16px;border:1px solid var(--border);border-radius:6px;font-size:14px;width:200px;text-align:center;background:var(--card-bg);color:var(--text)}
.lock-box button{margin-top:12px;padding:8px 24px;background:#1a73e8;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px}
.lock-box .err{color:#e53935;margin-top:8px;font-size:13px;display:none}
/* Detail modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;justify-content:center;align-items:center}
.modal-overlay.active{display:flex}
.modal{background:var(--card-bg);border-radius:14px;padding:24px;max-width:480px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.15);color:var(--text)}
.modal h3{font-size:16px;font-weight:600;margin-bottom:12px;line-height:1.4}
.modal-field{margin-bottom:10px}
.modal-field label{font-size:11px;color:var(--text3);display:block;margin-bottom:2px}
.modal-field .val{font-size:14px;color:var(--text)}
.modal-close{margin-top:16px;text-align:right}
.modal-close button{padding:6px 16px;border:1px solid var(--border);border-radius:6px;background:var(--card-bg);color:var(--text2);cursor:pointer;font-size:13px}
.modal-history{max-height:200px;overflow-y:auto;margin-top:8px}
.modal-history .hist-item{padding:4px 0;border-bottom:1px solid var(--border);font-size:12px}
</style>
</head>
<body>

<!-- 密码保护层 -->
<div class="lock-screen" id="lockScreen">
  <div class="lock-box">
    <h2>🔒 WorkflowMate 任务看板</h2>
    <input type="password" id="pwInput" placeholder="输入访问密码" onkeydown="if(event.key==='Enter')unlock()">
    <br>
    <button onclick="unlock()">进入</button>
    <div class="err" id="errMsg">密码错误</div>
  </div>
</div>

<!-- 看板内容（默认隐藏） -->
<div class="board" id="boardContent" style="display:none">
  <div class="bar">
    <div class="bar-left">
      <h1>📋 任务看板</h1>
      <button class="theme-btn" onclick="toggleTheme()" title="切换暗色模式">🌓</button>
    </div>
    <button class="refresh-btn" onclick="location.reload()">🔄 刷新</button>
  </div>
  <div class="cols" id="content"></div>
  <div class="footer" id="footer"></div>
</div>

<!-- 详情弹窗 -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<script>
// 访问密码（SHA-256 hash of "workflow2026"）
var PASS_HASH='6bee0697eab3552f6c2f1807c953c9e7cdc256233f2c67590e3ab5d988fc9469';

async function sha256(str){
  var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0')}).join('');
}

async function unlock(){
  var pw=document.getElementById('pwInput').value;
  var hash=await sha256(pw);
  if(hash===PASS_HASH){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('boardContent').style.display='block';
    sessionStorage.setItem('wfm_auth','1');
  }else{
    document.getElementById('errMsg').style.display='block';
  }
}
if(sessionStorage.getItem('wfm_auth')==='1'){
  document.getElementById('lockScreen').style.display='none';
  document.getElementById('boardContent').style.display='block';
}

// Dark mode
function toggleTheme(){
  var t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('wfm_theme',t);
}
(function(){
  var saved=localStorage.getItem('wfm_theme');
  if(saved)document.documentElement.setAttribute('data-theme',saved);
  else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches)
    document.documentElement.setAttribute('data-theme','dark');
})();

var DATA = [{"id": "1778908739017", "type": "commitment", "content": "跟完 7412 供应商报价交期确认（FCA上海 4周）", "status": "in_progress", "createdAt": "2026-05-16T05:18:59.017Z", "assignee": "", "dueDate": "", "statusHistory": [{"status": "pending", "timestamp": "2026-05-16T05:18:59.036Z"}, {"status": "in_progress", "timestamp": "2026-05-16T05:19:19.290Z", "note": "已联系FCA确认交期"}]}, {"id": "1778908753337", "type": "commitment", "content": "跟完 7414 供应商报价（DAP莫斯科 180天）", "status": "pending", "createdAt": "2026-05-16T05:19:13.337Z", "assignee": "", "dueDate": "", "statusHistory": [{"status": "pending", "timestamp": "2026-05-16T05:19:13.337Z"}]}, {"id": "1778908753349", "type": "commitment", "content": "上海乾亦服务费报价成单转化追踪", "status": "pending", "createdAt": "2026-05-16T05:19:13.349Z", "assignee": "", "dueDate": "", "statusHistory": [{"status": "pending", "timestamp": "2026-05-16T05:19:13.349Z"}]}, {"id": "1778908753341", "type": "commitment", "content": "建立 RTX PRO 5000 GPU 测试体系", "status": "pending", "createdAt": "2026-05-16T05:19:13.341Z", "assignee": "", "dueDate": "", "statusHistory": [{"status": "pending", "timestamp": "2026-05-16T05:19:13.341Z"}]}, {"id": "1778908753347", "type": "commitment", "content": "整理周会材料（服务器+AI小组）", "status": "pending", "createdAt": "2026-05-16T05:19:13.347Z", "assignee": "", "dueDate": "", "statusHistory": [{"status": "pending", "timestamp": "2026-05-16T05:19:13.347Z"}]}, {"id": "1778919144700", "type": "commitment", "content": "联系南京审元客户确认需求文档", "status": "pending", "createdAt": "2026-05-16T08:12:24.700Z", "assignee": "", "dueDate": "", "statusHistory": [{"status": "pending", "timestamp": "2026-05-16T08:12:24.702Z"}]}];

var COLS = [
  {key:'pending',label:'待办',bgVar:'--pending-bg',bcVar:'--pending-bc',badgeVar:'--pending-badge'},
  {key:'in_progress',label:'进行中',bgVar:'--progress-bg',bcVar:'--progress-bc',badgeVar:'--progress-badge'},
  {key:'completed',label:'已完成',bgVar:'--done-bg',bcVar:'--done-bc',badgeVar:'--done-badge'}
];

function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function ago(d){var m=Math.floor((Date.now()-Date.parse(d))/60000);if(m<1)return'刚刚';if(m<60)return m+'分';var h=Math.floor(m/60);if(h<24)return h+'时';return Math.floor(h/24)+'天'}

function showDetail(id){
  var t=DATA.find(function(x){return x.id===id});
  if(!t)return;
  var typeLabel={commitment:'承诺',decision:'决策',extracted:'提取'};
  var statusLabel={pending:'待办',in_progress:'进行中',completed:'已完成'};
  var h='<h3>'+esc(t.content)+'</h3>';
  h+='<div class="modal-field"><label>类型</label><div class="val">'+(typeLabel[t.type||'extracted']||'任务')+'</div></div>';
  h+='<div class="modal-field"><label>状态</label><div class="val">'+(statusLabel[t.status]||t.status)+'</div></div>';
  if(t.assignee)h+='<div class="modal-field"><label>负责人</label><div class="val">'+esc(t.assignee)+'</div></div>';
  if(t.dueDate)h+='<div class="modal-field"><label>截止时间</label><div class="val">'+esc(t.dueDate)+'</div></div>';
  h+='<div class="modal-field"><label>创建时间</label><div class="val">'+new Date(t.createdAt).toLocaleString('zh-CN')+'</div></div>';
  if(t.statusHistory&&t.statusHistory.length>0){
    h+='<div class="modal-field"><label>状态变更记录</label><div class="modal-history">';
    t.statusHistory.forEach(function(s){
      var note=s.note?' — '+esc(s.note):'';
      h+='<div class="hist-item"><span style="color:var(--text3)">'+new Date(s.timestamp).toLocaleString('zh-CN')+'</span> '+(statusLabel[s.status]||s.status)+note+'</div>';
    });
    h+='</div></div>';
  }
  h+='<div class="modal-close"><button onclick="closeModal()">关闭</button></div>';
  document.getElementById('modalContent').innerHTML=h;
  document.getElementById('modalOverlay').classList.add('active');
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('active')}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});

var cs=getComputedStyle(document.documentElement);
COLS.forEach(function(c){
  var items=DATA.filter(function(t){return t.status===c.key});
  var bg=cs.getPropertyValue(c.bgVar).trim();
  var bc=cs.getPropertyValue(c.bcVar).trim();
  var badge=cs.getPropertyValue(c.badgeVar).trim();
  var html='<div><div class="col-title"><span style="font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px;background:var('+c.bgVar+');color:var('+c.badgeVar+')">'+c.label+'</span><span class="col-count">'+items.length+'</span></div>';
  if(items.length===0)html+='<div class="empty">空</div>';
  else items.forEach(function(t){
    var typeLabel={commitment:'承诺',decision:'决策',extracted:'提取'};
    var typeClass={commitment:'type-commitment',decision:'type-decision',extracted:'type-extracted'};
    var note=[].concat(t.statusHistory||[]).reverse().find(function(h){return h.note});
    html+='<div class="card" style="background:var('+c.bgVar+');border-color:var('+c.bcVar+')" onclick="showDetail(\''+t.id+'\')">';
    html+='<span class="card-type '+typeClass[t.type||'extracted']+'">'+(typeLabel[t.type||'extracted']||'任务')+'</span>';
    html+='<div class="card-title">'+esc(t.content)+'</div>';
    if(note)html+='<div class="card-note">📝 '+esc(note.note||'')+'</div>';
    if(t.completionNote)html+='<div class="card-note" style="color:var(--done-badge)">✅ '+esc(t.completionNote)+'</div>';
    // Meta tags
    var metaHtml='<div class="card-meta">';
    if(t.assignee)metaHtml+='<span class="meta-tag assignee">👤 '+esc(t.assignee)+'</span>';
    if(t.dueDate){
      var isOverdue=new Date(t.dueDate)<new Date();
      metaHtml+='<span class="meta-tag '+(isOverdue?'overdue':'due')+'">'+(isOverdue?'⚠️ ':'📅 ')+esc(t.dueDate)+'</span>';
    }
    metaHtml+='<span class="meta-tag">'+ago(t.createdAt)+'</span>';
    metaHtml+='</div>';
    html+=metaHtml;
    html+='</div>';
  });
  html+='</div>';
  document.getElementById('content').innerHTML+=html;
});
document.getElementById('footer').textContent='WorkflowMate · 45秒自动刷新 · 共 '+DATA.length+' 个任务'
</script>
</body>
</html>
