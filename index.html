<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;min-height:100vh}
.board{max-width:900px;margin:0 auto;padding:12px 16px}
h1{font-size:17px;font-weight:600;margin-bottom:12px;color:#111}
.cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.col-title{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:12px;font-weight:600}
.col-count{font-size:12px;color:#999}
.card{padding:10px;margin-bottom:8px;border-radius:8px;border:1px solid;font-size:13px}
.card-title{color:#333;margin-bottom:4px;line-height:1.4}
.card-note{font-size:11px;color:#888;margin-top:3px;line-height:1.3}
.card-time{font-size:10px;color:#bbb;margin-top:4px}
.empty{padding:20px 0;text-align:center;color:#ccc;font-size:13px;border:1px dashed #ddd;border-radius:8px}
.footer{text-align:center;margin-top:20px;font-size:11px;color:#bbb}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.refresh-btn{border:1px solid #ddd;border-radius:6px;padding:3px 10px;background:#fff;cursor:pointer;font-size:12px;color:#666}
</style>
</head>

function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function ago(d){var m=Math.floor((Date.now()-Date.parse(d))/60000);if(m<1)return'刚刚';if(m<60)return m+'分';var h=Math.floor(m/60);if(h<24)return h+'时';return Math.floor(h/24)+'天'}

  var items=DATA.filter(function(t){return t.status===c.key});
  var html='<div><div class="col-title"><span style="font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px;background:'+c.bg+';color:'+c.badge+'">'+c.label+'</span><span class="col-count">'+items.length+'</span></div>';

  else items.forEach(function(t){
    var note=[].concat(t.statusHistory||[]).reverse().find(function(h){return h.note});
